name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/constitution _site/proposals
          cp site/index.html site/_sidebar.md site/_404.md _site/
          cp README.md CONTRIBUTING.md GOVERNANCE.md CODE_OF_CONDUCT.md LICENSE _site/
          cp constitution/*.md _site/constitution/
          cp proposals/*.md _site/proposals/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
