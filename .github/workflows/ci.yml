name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 如果你需要 node 环境来运行 markdownlint-cli，指定 Node 24（GitHub 推荐使用最新受支持的 LTS/Current）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: markdownlint "**/*.md" || true

  validate-front-matter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-python 本身是一个 action（其代码由 GitHub 执行），对于该 action 的内部 runtime 会由 action 作者决定。
      # 这里指定 python 版本用于后续脚本运行。
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run front-matter validator
        run: python3 scripts/validate_front_matter.py